<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="All-Seeing Eye">
  <defs>
    <radialGradient id="iris" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#7dffa2" />
      <stop offset="45%" stop-color="#00ff41" />
      <stop offset="100%" stop-color="#033d1c" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#010803" />
  <!-- eye outline -->
  <path d="M56 256 Q 256 108 456 256 Q 256 404 56 256 Z" fill="none" stroke="#00ff41" stroke-width="10" stroke-linejoin="round" />
  <!-- iris with graticule -->
  <circle cx="256" cy="256" r="104" fill="url(#iris)" stroke="#00ff41" stroke-width="6" />
  <g stroke="#052012" fill="none" stroke-width="4" opacity="0.7">
    <ellipse cx="256" cy="256" rx="104" ry="38" />
    <ellipse cx="256" cy="256" rx="104" ry="74" />
    <ellipse cx="256" cy="256" rx="38" ry="104" />
    <line x1="152" y1="256" x2="360" y2="256" />
  </g>
  <!-- pupil + glint -->
  <circle cx="256" cy="256" r="44" fill="#010803" stroke="#7dffa2" stroke-width="4" />
  <circle cx="240" cy="240" r="10" fill="#c8ffd8" />
  <!-- tracked contacts -->
  <g fill="#c8ffd8">
    <circle cx="150" cy="196" r="8" />
    <circle cx="356" cy="318" r="8" />
    <circle cx="318" cy="176" r="6" />
  </g>
  <!-- scanner brackets -->
  <g stroke="#00ff41" stroke-width="8" opacity="0.9">
    <path d="M112 112 h56 M400 112 h-56 M112 400 h56 M400 400 h-56" stroke-linecap="round" />
    <path d="M112 112 v56 M112 400 v-56 M400 112 v56 M400 400 v-56" stroke-linecap="round" />
  </g>
</svg>
